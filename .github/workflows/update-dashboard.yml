name: Update GitHub Dashboard & Contribution Snake

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: github-dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    name: Generate dashboard and snake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-dashboard.js

      - name: Generate contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-snake.js

      - name: Validate assets
        run: |
          test -f assets/dashboard.svg
          test -s assets/dashboard.svg
          grep -q "<svg" assets/dashboard.svg
          grep -q "</svg>" assets/dashboard.svg
          test -f assets/snake.svg
          test -s assets/snake.svg
          grep -q "<svg" assets/snake.svg
          grep -q "</svg>" assets/snake.svg
          echo "Asset validation passed."

      - name: Commit dashboard and snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/dashboard.svg assets/snake.svg

          if git diff --cached --quiet; then
            echo "No dashboard or snake changes detected."
          else
            git commit -m "Update GitHub dashboard & contribution snake [skip ci]"
            git push
          fi
