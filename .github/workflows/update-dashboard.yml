name: Update GitHub Dashboard

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: github-dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    name: Generate dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-dashboard.js

      - name: Check generated dashboard
        run: |
          test -f assets/dashboard.svg
          test -s assets/dashboard.svg
          echo "dashboard.svg generated successfully."

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/dashboard.svg

          if git diff --cached --quiet; then
            echo "No dashboard changes detected."
          else
            git commit -m "Update dashboard"
            git push
          fi
